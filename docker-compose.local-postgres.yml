# Local/CI helper only.
# Production uses PostgreSQL on a dedicated database VM, not as a service in the
# main app VM Docker Compose stack.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rizzlerpies
      POSTGRES_USER: rizzlerpies
      POSTGRES_PASSWORD: rizzlerpies
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizzlerpies -d rizzlerpies"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
