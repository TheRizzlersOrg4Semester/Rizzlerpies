services:
  app:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_PATH: /data/app.db
      OTEL_SERVICE_NAME: rizzlerpies_app
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://host.docker.internal:4318/v1/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "4000"
    volumes:
      - app_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js", "http://127.0.0.1:4000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  proxy:
    build:
      context: .
      dockerfile: ops/nginx/Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

volumes:
  app_data:

networks:
  backend:
