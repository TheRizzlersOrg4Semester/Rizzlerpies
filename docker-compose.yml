x-app-service: &app-service
  build:
    context: .
  depends_on:
    - signoz
  environment: &app-environment
    NODE_ENV: production
    PORT: 4000
    DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
    OTEL_SERVICE_NAME: rizzlerpies
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://signoz:4318/v1/traces
    OTEL_LOG_LEVEL: info
  expose:
    - "4000"
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "scripts/healthcheck.js", "http://127.0.0.1:4000/readyz"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - backend

services:
  app-a:
    <<: *app-service
    environment:
      <<: *app-environment
      INSTANCE_NAME: app-a

  app-b:
    <<: *app-service
    environment:
      <<: *app-environment
      INSTANCE_NAME: app-b

  proxy:
    build:
      context: .
      dockerfile: ops/nginx/Dockerfile
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  signoz:
    image: signoz/signoz:latest
    ports:
      - "3301:3301"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    networks:
      - backend

volumes:
  # Legacy SQLite storage retained for one-time migration and rollback review.
  # Runtime app containers now use DATABASE_URL and do not mount this volume.
  app_data:

networks:
  backend:
