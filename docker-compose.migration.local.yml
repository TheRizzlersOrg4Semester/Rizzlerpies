# Local-only SQLite to PostgreSQL data migration override.
# Use this for development/CI-style validation when the repository fixture
# legacy/src/app.db exists. Production VM migration uses docker-compose.migration.yml
# with the legacy app_data volume mounted at /data.
services:
  migrate-sqlite-data:
    build:
      context: .
    environment:
      DATABASE_PATH: /seed/app.db
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
    command: npm run db:migrate:data
    volumes:
      - ./legacy/src/app.db:/seed/app.db:ro
    networks:
      - backend
    profiles:
      - migration
