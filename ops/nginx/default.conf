resolver 127.0.0.11 valid=10s ipv6=off;

upstream express_app {
  zone express_app 64k;
  server app-a:4000 resolve max_fails=1 fail_timeout=10s;
  server app-b:4000 resolve max_fails=1 fail_timeout=10s;
}

server {
  listen 80;
  server_name rizzlerpies.dk localhost 127.0.0.1 _;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name rizzlerpies.dk localhost 127.0.0.1 _;

  ssl_certificate /etc/nginx/certs/rizzlerpies.dk.pem;
  ssl_certificate_key /etc/nginx/certs/rizzlerpies.dk-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 10m;

  location / {
    proxy_pass http://express_app;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
