name: Node CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x]

    env:
      PORT: 4000
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate main files
        run: |
          test -f package.json
          test -f app.js
          test -f package-lock.json

      - name: Syntax check
        run: node --check app.js

      - name: Lint JavaScript
        run: npm run lint

      - name: Start application
        run: |
          npm start &
          echo $! > app.pid

      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:${PORT}/" > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          exit 1

      - name: Smoke test routes
        run: |
          curl -fsS "http://127.0.0.1:${PORT}/" > /dev/null
          curl -fsS "http://127.0.0.1:${PORT}/apidocs" > /dev/null
          curl -fsS "http://127.0.0.1:${PORT}/api/recipe/recipes/" > /dev/null
          curl -fsS "http://127.0.0.1:${PORT}/api/recipe/tags/" > /dev/null
          curl -fsS "http://127.0.0.1:${PORT}/api/recipe/ingredients/" > /dev/null

      - name: Stop application
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

      - name: Validate Docker Compose configuration
        run: docker compose config > /tmp/docker-compose.rendered.yml

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for HTTPS proxy readiness
        run: |
          for i in {1..20}; do
            if curl -kfsS "https://127.0.0.1/readyz" > /dev/null; then
              echo "Proxy stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "Docker Compose stack did not start in time"
          exit 1

      - name: Smoke test proxy redirect and HTTPS routes
        run: |
          curl -fsSI "http://127.0.0.1/" | grep -i "location: https://"
          curl -kfsS "https://127.0.0.1/" > /dev/null
          curl -kfsS "https://127.0.0.1/apidocs" > /dev/null
          curl -kfsS "https://127.0.0.1/api/recipe/recipes/" > /dev/null
          curl -kfsS "https://127.0.0.1/api/recipe/tags/" > /dev/null
          curl -kfsS "https://127.0.0.1/api/recipe/ingredients/" > /dev/null

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: |
          docker compose down --volumes --remove-orphans

  deploy-to-azure-vm:
    needs: build-and-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: actions/checkout@v4

      - name: Skip deployment when Azure secrets are not configured
        if: ${{ env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_PRIVATE_KEY == '' }}
        run: echo "Azure deployment secrets are not configured; skipping deployment."

      - name: Validate deploy secrets
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"
          test -n "${SSH_PRIVATE_KEY}"

      - name: Configure SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release bundle
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          DEPLOY_ROOT="${DEPLOY_PATH:-/home/${SSH_USER}/rizzlerpies}"
          RELEASE_DIR="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_ROOT}/releases'"
          git archive --format=tar HEAD | ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "rm -rf '${RELEASE_DIR}' && mkdir -p '${RELEASE_DIR}' && tar -xf - -C '${RELEASE_DIR}'"

      - name: Deploy release on VM
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          DEPLOY_ROOT="${DEPLOY_PATH:-/home/${SSH_USER}/rizzlerpies}"
          RELEASE_DIR="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          CURRENT_LINK="${DEPLOY_ROOT}/current"
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "ln -sfn '${RELEASE_DIR}' '${CURRENT_LINK}' && bash '${CURRENT_LINK}/scripts/deploy/remote-deploy.sh' '${CURRENT_LINK}'"
