name: Node CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rizzlerpies
          POSTGRES_USER: rizzlerpies
          POSTGRES_PASSWORD: rizzlerpies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizzlerpies -d rizzlerpies"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BASE_URL: http://127.0.0.1:4000
      PORT: 4000
      DATABASE_PATH: legacy/src/app.db
      DATABASE_URL: postgres://rizzlerpies:rizzlerpies@127.0.0.1:5432/rizzlerpies
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate main files
        run: |
          test -f package.json
          test -f app.js
          test -f package-lock.json
          test -f db.js
          test -f migrations/1779722203738_initial-recipe-schema.js
          test -f scripts/db/migrate-sqlite-to-postgres.js
          test -f scripts/test/smoke-db.sh

      - name: Syntax check
        run: |
          node --check app.js
          node --check db.js
          node --check scripts/db/migrate-sqlite-to-postgres.js
          bash -n scripts/test/smoke-db.sh

      - name: Lint JavaScript
        run: npm run lint

      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.migration.yml config --quiet

      - name: Build Docker images
        run: docker compose build app-a proxy

      - name: Run PostgreSQL schema migrations
        run: npm run db:migrate

      - name: Import CI recipe data from SQLite fixture
        run: npm run db:migrate:data

      - name: Verify imported recipe data
        run: |
          node <<'NODE'
          const { Pool } = require('pg');

          const pool = new Pool({ connectionString: process.env.DATABASE_URL });

          (async () => {
            const result = await pool.query(`
              SELECT
                (SELECT COUNT(*)::int FROM recipes) AS recipes,
                (SELECT COUNT(*)::int FROM ingredients) AS ingredients,
                (SELECT COUNT(*)::int FROM tags) AS tags,
                (SELECT COUNT(*)::int FROM recipe_ingredients) AS recipe_ingredients,
                (SELECT COUNT(*)::int FROM recipe_tags) AS recipe_tags
            `);
            console.log(result.rows[0]);

            if (result.rows[0].recipes < 1) {
              throw new Error('Expected imported recipe rows');
            }
          })()
            .finally(() => pool.end())
            .catch((err) => {
              console.error(err);
              process.exit(1);
            });
          NODE

      - name: Start application
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for readiness
        run: |
          for i in {1..20}; do
            if curl -fsS "${BASE_URL}/readyz" > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready in time"
          exit 1

      - name: Smoke test migrated recipe endpoints
        run: npm run smoke:db

      - name: Show application logs on failure
        if: failure()
        run: |
          if [ -f app.log ]; then
            cat app.log
          fi

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

  deploy-to-azure-vm:
    needs: build-and-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        uses: actions/checkout@v4

      - name: Skip deployment when Azure secrets are not configured
        if: ${{ env.SSH_HOST == '' || env.SSH_USER == '' || env.SSH_PRIVATE_KEY == '' }}
        run: echo "Azure deployment secrets are not configured; skipping deployment."

      - name: Validate deploy secrets
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"
          test -n "${SSH_PRIVATE_KEY}"

      - name: Configure SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release bundle
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          DEPLOY_ROOT="${DEPLOY_PATH:-/home/${SSH_USER}/rizzlerpies}"
          RELEASE_DIR="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_ROOT}/releases'"
          git archive --format=tar HEAD | ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "rm -rf '${RELEASE_DIR}' && mkdir -p '${RELEASE_DIR}' && tar -xf - -C '${RELEASE_DIR}'"

      - name: Deploy release on VM
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_PRIVATE_KEY != '' }}
        run: |
          DEPLOY_ROOT="${DEPLOY_PATH:-/home/${SSH_USER}/rizzlerpies}"
          RELEASE_DIR="${DEPLOY_ROOT}/releases/${GITHUB_SHA}"
          CURRENT_LINK="${DEPLOY_ROOT}/current"
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "ln -sfn '${RELEASE_DIR}' '${CURRENT_LINK}' && bash '${CURRENT_LINK}/scripts/deploy/remote-deploy.sh' '${CURRENT_LINK}'"
